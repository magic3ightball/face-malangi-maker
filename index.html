<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="얼굴 말랑이">
<meta name="theme-color" content="#e9e4ff">
<title>얼굴 말랑이 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg-top: #e9e4ff;
    --bg-bottom: #ffe3ef;
    --ink: #2b2450;
    --ink-soft: #6b6494;
    --panel: rgba(255,255,255,.62);
    --panel-edge: rgba(255,255,255,.9);
    --accent: #5b43e8;
    --shadow: rgba(60,40,140,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #1b1740;
      --bg-bottom: #35153a;
      --ink: #f1ecff;
      --ink-soft: #b3a9de;
      --panel: rgba(30,24,70,.62);
      --panel-edge: rgba(255,255,255,.14);
      --accent: #9a86ff;
      --shadow: rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #1b1740;
    --bg-bottom: #35153a;
    --ink: #f1ecff;
    --ink-soft: #b3a9de;
    --panel: rgba(30,24,70,.62);
    --panel-edge: rgba(255,255,255,.14);
    --accent: #9a86ff;
    --shadow: rgba(0,0,0,.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(170deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #stage.grabbing { cursor: grabbing; }

  header {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 22px 0;
    pointer-events: none;
  }
  h1 { margin: 0; font-weight: 600; font-size: clamp(26px, 6vw, 40px); letter-spacing: -.02em; }
  header p { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; }

  #panel {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 0;
    width: min(560px, calc(100% - 24px));
    margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    padding: 14px 16px 16px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 26px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 34px var(--shadow);
    display: grid; gap: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .swatches { display: flex; gap: 8px; }
  .sw {
    width: 30px; height: 30px; border-radius: 11px; border: 2px solid transparent; padding: 0; cursor: pointer;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,.14), inset 0 4px 8px rgba(255,255,255,.55);
  }
  .sw[aria-pressed="true"] { border-color: var(--ink); transform: scale(1.1); }
  .seg { display: flex; background: rgba(120,110,190,.16); border-radius: 14px; padding: 3px; }
  .seg button {
    font: inherit; font-size: 15px; color: var(--ink-soft); background: none; border: 0; padding: 7px 12px; border-radius: 11px; cursor: pointer; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .iconbtn {
    font: inherit; font-size: 15px; color: var(--ink); background: rgba(120,110,190,.16); border: 0; border-radius: 14px; padding: 8px 12px; cursor: pointer; white-space: nowrap;
  }
  label.sl { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-soft); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .iconbtn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #hint { padding: 0 20px; box-sizing: border-box;
    position: fixed; left: 0; right: 0; top: 92px;
    text-align: center; color: var(--ink-soft); font-size: 15px; pointer-events: none;
    transition: opacity .6s; opacity: 0;
  }
  @media (max-height: 640px) { header p { display: none; } }
  html, body { overscroll-behavior: none; position: fixed; inset: 0; }
  body { -webkit-touch-callout: none; -webkit-user-select: none; }
  #more { display: grid; gap: 12px; }
  #more[hidden] { display: none; }
  #panel .row { row-gap: 8px; }
  @media (pointer: coarse) {
    .seg button, .iconbtn { min-height: 40px; }
    .sw { width: 34px; height: 34px; }
    #panel { padding: 10px 12px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }

  /* 사진 올리기 화면 */
  #maker {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; overflow-y: auto; padding: 16px;
    background: linear-gradient(170deg, var(--bg-top), var(--bg-bottom));
  }
  #maker[hidden] { display: none; }
  .mk-card {
    margin: auto; width: min(440px, 100%); padding: 26px 22px; text-align: center;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 26px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 34px var(--shadow);
  }
  .mk-card h2 { margin: 0 0 6px; font-weight: 600; font-size: 26px; letter-spacing: -.02em; }
  .mk-card p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.55; }
  #mkDrop {
    margin: 18px 0 14px; display: grid; place-items: center; gap: 6px; min-height: 180px; padding: 16px;
    border: 2px dashed rgba(120,110,190,.45); border-radius: 20px; cursor: pointer; color: var(--ink-soft); font-size: 15px;
  }
  #mkDrop.over { border-color: var(--accent); background: rgba(120,110,190,.12); }
  #mkDrop strong { color: var(--ink); font-size: 17px; font-weight: 600; }
  #mkDrop[hidden] { display: none; }
  #mkStatus { min-height: 1.5em; }
  #mkStatus.err { color: #d0365a; }
  .mk-pick { font: inherit; font-size: 16px; color: #fff; background: var(--accent); border: 0; border-radius: 14px; padding: 10px 18px; cursor: pointer; }
  .mk-pick:disabled { opacity: .5; cursor: progress; }
  .mk-note { margin-top: 14px !important; font-size: 13px !important; }
  .mk-card.editing { width: min(560px, 100%); padding: 20px 16px; }
  #mkEditor { display: grid; gap: 10px; margin-top: 14px; }
  #mkEditor[hidden] { display: none; }
  #mkCanvas { display: block; margin: 0 auto; border-radius: 14px; touch-action: none; cursor: none; }
  .mk-tools { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .mk-size { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-soft); }
  .mk-size input { width: 120px; }
  .mk-size[hidden] { display: none; }
  .mk-pick:disabled { cursor: not-allowed; }
  #newPhoto { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); right: 16px; z-index: 5; }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D 말랑이 큐브. 눌러서 만져보세요."></canvas>

<header>
  <h1>얼굴 말랑이</h1>
  <p>사진 속 얼굴로 만든 말랑이를 꾹 눌러 보세요</p>
</header>


<div id="maker">
  <div class="mk-card" id="mkCard">
    <h2 id="mkTitle">얼굴 말랑이 만들기</h2>
    <p id="mkLead">사진을 넣으면 얼굴을 자동으로 오려 주고,<br>직접 다듬은 모양 그대로 얼굴 말랑이로 만들어요.</p>
    <label id="mkDrop" for="mkFile">
      <strong id="mkDropTitle">사진 고르기</strong>
      <span id="mkDropSub">여기를 누르거나 사진을 끌어다 놓으세요</span>
    </label>
    <input id="mkFile" type="file" accept="image/*" hidden>
    <div id="mkEditor" hidden>
      <canvas id="mkCanvas" aria-label="얼굴 영역 고르기. 얼굴 둘레를 따라 그리거나 칠해서 고쳐요."></canvas>
      <div class="mk-tools">
        <div class="seg" role="group" aria-label="붓 종류">
          <button id="mkLasso" type="button" aria-pressed="true">따라 그리기</button>
          <button id="mkErase" type="button" aria-pressed="false">지우기</button>
          <button id="mkRestore" type="button" aria-pressed="false">살리기</button>
        </div>
        <label class="mk-size" id="mkSizeWrap">붓 크기 <input id="mkSize" type="range" min="6" max="90" value="28"></label>
      </div>
      <div class="mk-tools">
        <button id="mkUndo" class="iconbtn" type="button" disabled>되돌리기</button>
        <button id="mkAuto" class="iconbtn" type="button" hidden>자동 선택으로</button>
        <button id="mkReset" class="iconbtn" type="button">모두 지우기</button>
        <button id="mkAgain" class="iconbtn" type="button">다른 사진</button>
      </div>
      <div class="mk-tools"><button id="mkMake" class="mk-pick" type="button">이대로 말랑이 만들기</button></div>
    </div>
    <p id="mkStatus" role="status" aria-live="polite"></p>
    <p class="mk-note">사진은 이 기기 안에서만 처리되고 어디에도 올라가지 않아요.</p>
  </div>
</div>
<button id="newPhoto" class="iconbtn" type="button" hidden>다른 사진</button>

<div id="panel">
  <div class="row">
    <div class="seg" role="group" aria-label="만지는 방식">
      <button id="modePress" aria-pressed="true">누르기</button>
      <button id="modePull" aria-pressed="false">당기기</button>
      <button id="modeBubble" aria-pressed="false" hidden>바풍</button>
    </div>
    <button id="glassBtn" class="iconbtn" aria-label="질감 바꾸기">질감: 젤리</button>
    <button id="moreBtn" class="iconbtn" aria-expanded="true" aria-controls="more">설정 접기</button>
  </div>
  <div id="more">
    <div class="row">
      <div class="swatches" id="swatches" role="group" aria-label="색상"></div>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="로고" hidden>
        <button id="logoRaised" aria-pressed="true">양각</button>
        <button id="logoEngraved" aria-pressed="false">음각</button>
        <button id="logoNone" aria-pressed="false">로고 없음</button>
      </div>
      <button id="glitter" class="iconbtn" aria-pressed="false">반짝이 끔</button>
      <button id="mute" class="iconbtn" aria-label="소리 종류 바꾸기">소리: 질척</button>
      <button id="boingBtn" class="iconbtn" aria-pressed="true">띠용 소리 켬</button>
      <button id="boingTest" class="iconbtn">띠용 들어보기</button>
      <button id="boingKind" class="iconbtn" hidden>띠용 효과음</button>
    </div>
    <label class="sl" hidden>로고 글씨
      <input id="logoText" type="text" maxlength="14" value="NICE CUBE" aria-label="로고 글씨" style="font:inherit;font-size:16px;padding:7px 10px;border-radius:12px;border:1px solid var(--panel-edge);background:rgba(120,110,190,.12);color:var(--ink);width:100%;min-width:0">
    </label>
    <p class="credits" style="margin:0;font-size:12px;line-height:1.5;color:var(--ink-soft)">효과음 출처: “<a href="https://budgetpixel.com/sfx/cartoon-eye-pop-boing-d31307bb" target="_blank" rel="noopener">Cartoon Eye Pop Boing</a>” by BudgetPixel AI — CC BY 4.0</p>
    <label class="sl">쫀득함
      <input id="recover" type="range" min="0.8" max="9" step="0.1" value="1.7" aria-label="복원 속도. 왼쪽일수록 천천히 돌아옴">
    </label>
    <label class="sl">누르는 힘
      <input id="depth" type="range" min="0.2" max="0.85" step="0.01" value="0.62" aria-label="눌림 깊이">
    </label>
  </div>
</div>
<div id="hint">말랑이를 눌러 보세요. 빈 곳을 끌면 사방으로 돌아가요.<br>트랙패드에서 두 손가락을 벌리면 늘어나요. 물슬라임은 '바풍'으로 공기 풍선을 만들어요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.startMalangi = function (MAKER) {
  "use strict";

  /* ---------- 기본 설정 ---------- */
  var canvas = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.toneMappingExposure = 1.0;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 50);
  camera.position.set(0, 0.35, 3.9);
  camera.lookAt(0, 0, 0);

  /* ---------- 환경맵 (소프트박스 느낌의 하이라이트) ---------- */
  (function makeEnv() {
    var c = document.createElement("canvas");
    c.width = 512; c.height = 256;
    var g = c.getContext("2d");
    var grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, "#9fb0ff");
    grad.addColorStop(0.5, "#4a4478");
    grad.addColorStop(1, "#1d1a3a");
    g.fillStyle = grad; g.fillRect(0, 0, 512, 256);
    g.fillStyle = "rgba(255,255,255,0.95)";
    g.fillRect(50, 36, 110, 70);
    g.fillRect(290, 28, 150, 50);
    g.fillRect(200, 150, 40, 30);
    g.fillStyle = "rgba(255,240,250,0.6)";
    g.fillRect(190, 120, 60, 40);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.mapping = THREE.EquirectangularReflectionMapping;
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(tex).texture;
    pm.dispose();
  })();

  var key = new THREE.DirectionalLight(0xffffff, 0.6);
  key.position.set(2.5, 4, 3);
  scene.add(key);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a8fd0, 0.3));

  /* ---------- 둥근 큐브 지오메트리 ---------- */
  var FACE_S = 0.66;          // 얼굴 이미지 절반 크기(로컬 단위)
  var HEAD_RADII = MAKER.radii;   // 각도별 얼굴 외곽선까지의 거리(사진 절반 크기 기준)   // 얼굴 외곽선: 가운데에서 각도별 거리(0~1), 180방향
  var HQ = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var SHAPE = "face";   // 얼굴 모양만 사용
  var START_TEX = Math.max(0, Math.min(3, parseInt(HQ.get("tex") || "0", 10) || 0));
  var IS_MOBILE = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  var SEG = IS_MOBILE ? 22 : 30, HALF = 0.5, R = 0.22;      // 휴대폰은 계산량을 줄임
  var geo = new THREE.BoxGeometry(1, 1, 1, SEG, SEG, SEG);
  var pos = geo.attributes.position;
  var N = pos.count;
  var rest = new Float32Array(N * 3);
  var restN = new Float32Array(N * 3);

  (function roundCube() {
    var inner = HALF - R, v = new THREE.Vector3(), c = new THREE.Vector3(), d = new THREE.Vector3();
    for (var i = 0; i < N; i++) {
      var bx = pos.getX(i) * 2, by = pos.getY(i) * 2, bz = pos.getZ(i) * 2;   // -1~1 정육면체 좌표
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i));
      c.set(
        Math.max(-inner, Math.min(inner, v.x)),
        Math.max(-inner, Math.min(inner, v.y)),
        Math.max(-inner, Math.min(inner, v.z))
      );
      d.copy(v).sub(c);
      if (d.lengthSq() < 1e-12) { d.copy(v).normalize(); }
      d.normalize();
      v.copy(c).addScaledVector(d, R);
      // 구에 살짝 가깝게 (젤리처럼 통통하게)
      var rl = v.length();
      v.multiplyScalar(1 - 0.1 + 0.1 * (0.6 / rl));
      // 아래쪽이 자중으로 살짝 퍼진 느낌
      var sag = 1 + 0.07 * (0.5 - v.y);
      v.x *= sag; v.z *= sag;
      // 완벽한 큐브가 아닌 미세한 울퉁불퉁함
      var lump = 0.014 * Math.sin(v.x * 7.0 + v.y * 3.0) * Math.cos(v.z * 6.0 + v.x * 2.0)
               + 0.01 * Math.sin(v.y * 9.0 + v.z * 5.0);
      v.addScaledVector(d, lump);
      if (SHAPE !== "cube") {
        // 정육면체를 구로 고르게 펴기(spherify)
        var x2 = bx * bx, y2 = by * by, z2 = bz * bz;
        var ux = bx * Math.sqrt(Math.max(0, 1 - y2 / 2 - z2 / 2 + y2 * z2 / 3));
        var uy = by * Math.sqrt(Math.max(0, 1 - z2 / 2 - x2 / 2 + z2 * x2 / 3));
        var uz = bz * Math.sqrt(Math.max(0, 1 - x2 / 2 - y2 / 2 + x2 * y2 / 3));
        var ul = Math.sqrt(ux * ux + uy * uy + uz * uz) || 1; ux /= ul; uy /= ul; uz /= ul;
        if (SHAPE === "sphere") {
          v.set(ux * 0.58, uy * 0.58, uz * 0.58); d.set(ux, uy, uz);
          var sgs = 1 + 0.06 * (0.3 - uy); v.x *= sgs; v.z *= sgs;            // 아래가 살짝 퍼짐
        } else {
          // 얼굴 모양: 각도마다 얼굴 외곽선까지의 거리만큼 늘려서 실루엣을 얼굴과 똑같이
          var th = Math.atan2(uy, ux); if (th < 0) th += 6.2832;
          var fi = th / 6.2832 * HEAD_RADII.length, i0 = Math.floor(fi) % HEAD_RADII.length, i1 = (i0 + 1) % HEAD_RADII.length, ft = fi - Math.floor(fi);
          var rth = HEAD_RADII[i0] * (1 - ft) + HEAD_RADII[i1] * ft;
          var S = FACE_S * rth, C = 0.36, zz = (uz < 0 ? -1 : 1) * Math.pow(Math.abs(uz), 0.7);   // 앞뒤는 살짝 볼록, 옆은 둥글고 통통하게
          v.set(ux * S, uy * S, zz * C);
          d.set(ux / (S * S), uy / (S * S), zz / (C * C)).normalize();
        }
      }
      pos.setXYZ(i, v.x, v.y, v.z);
      rest[i * 3] = v.x; rest[i * 3 + 1] = v.y; rest[i * 3 + 2] = v.z;
      restN[i * 3] = d.x; restN[i * 3 + 1] = d.y; restN[i * 3 + 2] = d.z;
    }
  })();

  geo.setAttribute("aRestN", new THREE.BufferAttribute(restN, 3));   // 반짝이 투영 방향을 표면 기준으로 정하려고 원래 법선도 전달
  geo.setAttribute("aRest", new THREE.BufferAttribute(rest, 3));

  // 면 경계에서 겹치는 점을 하나로 묶어, 눌렸을 때 이음새가 보이지 않게 법선을 직접 계산
  var weld = new Int32Array(N);
  var weldCount = 0;
  (function buildWeld() {
    var map = {};
    for (var i = 0; i < N; i++) {
      var k = Math.round(rest[i * 3] * 5000) + "_" + Math.round(rest[i * 3 + 1] * 5000) + "_" + Math.round(rest[i * 3 + 2] * 5000);
      if (map[k] === undefined) map[k] = weldCount++;
      weld[i] = map[k];
    }
  })();
  var idx = geo.index.array;
  var nrm = geo.attributes.normal;
  var accum = new Float32Array(weldCount * 3);

  function recomputeNormals() {
    accum.fill(0);
    var p = pos.array;
    for (var t = 0; t < idx.length; t += 3) {
      var a = idx[t], b = idx[t + 1], c = idx[t + 2];
      var ax = p[a * 3], ay = p[a * 3 + 1], az = p[a * 3 + 2];

    mbSpawn(cp.x - n.x * 0.1 + (Math.random() - 0.5) * spread * 2, cp.y - n.y * 0.1 + (Math.random() - 0.5) * spread * 2, cp.z - n.z * 0.1 + (Math.random() - 0.5) * spread * 2);
  }
  var mbAcc = 0;
  function mbUpdate(dt) {
    var on = isWater();
    mbPts.visible = on;
    if (!on) { cloudU.value = 0; return; }
    // 만지는 동안 새 기포가 생김
    var rate = (held ? 30 : 0) + (pinch.active ? 25 : 0) + Math.min(60, speed * 900);
    mbAcc += rate * dt;
    while (mbAcc >= 1) {
      mbAcc -= 1;
      if (held) mbSpawnNear(held.center, held.n, 0.18);
      else mbSpawn((Math.random() - 0.5) * 0.8, restMinY + Math.random() * (restMaxY - restMinY) * 0.7, (Math.random() - 0.5) * 0.8);
    }
    var H = restMaxY - restMinY, n = 0;
    for (var i = mbs.length - 1; i >= 0; i--) {
      var b = mbs[i];
      b.y += b.v * dt;
      if (b.y > restMaxY - 0.06) { mbs.splice(i, 1); continue; }
    }
    for (var j = 0; j < mbs.length; j++) {
      var m = mbs[j], vi = m.vi, sh = Math.pow(Math.max(0, (m.y - restMinY) / H), 1.5);
      mbPos[n * 3] = m.x + disp[vi * 3] * 0.7 + wob.sx * sh;
      mbPos[n * 3 + 1] = m.y + disp[vi * 3 + 1] * 0.7;
      mbPos[n * 3 + 2] = m.z + disp[vi * 3 + 2] * 0.7 + wob.sz * sh;
      n++;
    }
    mbGeo.setDrawRange(0, n); mbGeo.attributes.position.needsUpdate = true;
    cloudU.value = Math.min(1, mbs.length / 220);
  }

  // 한 점을 잡아 당기는 늘어남(핀치용, 누적)
  function addPullNC(cx, cy, cz, px, py, pz) {
    var L = Math.sqrt(px * px + py * py + pz * pz); if (L < 1e-5) return;
    var LMX = waterU.value === 1 ? 1.4 : 0.9, Ls = LMX * Math.tanh(L / LMX), kk = Ls / L;
    var vx = px * kk, vy = py * kk, vz = pz * kk, ux = vx / Ls, uy = vy / Ls, uz = vz / Ls;
    var cl = Math.sqrt(cx * cx + cy * cy + cz * cz) || 1, ddx = cx / cl, ddy = cy / cl, ddz = cz / cl;
    var neck = 0.22 * Ls, Rp = 0.38 + 0.2 * Ls;
    for (var j = 0; j < N; j++) {
      var rx = rest[j * 3], ry = rest[j * 3 + 1], rz = rest[j * 3 + 2];
      var uu = Math.max(0, Math.min(1, 0.5 + (rx * ddx + ry * ddy + rz * ddz)));
      var w = Math.pow(uu * uu * (3 - 2 * uu), 1.2);
      var qx = rx - cx, qy = ry - cy, qz = rz - cz;
      var bump = Math.exp(-(qx * qx + qy * qy + qz * qz) / (Rp * Rp));
      var ff = 0.85 * w + 0.3 * bump * (1 - w);
      var along = rx * ux + ry * uy + rz * uz, nk = neck * (0.4 + 0.6 * w);
      tgt[j * 3] += vx * ff - (rx - along * ux) * nk;
      tgt[j * 3 + 1] += vy * ff - (ry - along * uy) * nk;
      tgt[j * 3 + 2] += vz * ff - (rz - along * uz) * nk;
    }
  }

   따라 그리기(올가미)·지우기/살리기 붓으로 고침. 자동이 실패하면 빈 영역에서 시작 */
const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const HEIC_TO = "https://cdn.jsdelivr.net/npm/heic-to@1.6.5/dist/heic-to.js";   // LGPL-3.0, HEIC일 때만 불러옴
const OUT = 512;          // 얼굴 텍스처 크기
const FILL = 0.95;        // 가장 먼 외곽선이 텍스처 절반 크기의 몇 %에 오도록 (원본 말랑이와 같은 비율)
const RAYS = 180;         // 외곽선 각도 샘플 수

const $ = (id) => document.getElementById(id);
const statusEl = $("mkStatus"), fileEl = $("mkFile"), drop = $("mkDrop");
let busy = false, segmenterP = null;

function setStatus(msg, err) { statusEl.textContent = msg; statusEl.classList.toggle("err", !!err); }

function getSegmenter() {
  if (!segmenterP) segmenterP = (async () => {
    const { FilesetResolver, ImageSegmenter } = await import(VISION + "/vision_bundle.mjs");
    const fs = await FilesetResolver.forVisionTasks(VISION + "/wasm");
    const make = (delegate) => ImageSegmenter.createFromOptions(fs, {
      baseOptions: { modelAssetPath: MODEL, delegate },
      runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: false
    });
    try { return await make("GPU"); } catch (e) { return await make("CPU"); }
  })().catch((e) => { segmenterP = null; throw e; });
  return segmenterP;
}
getSegmenter().catch(() => {});   // 미리 받아 두기

// 자동 누끼: 머리카락+얼굴 피부 → 가장 큰 덩어리, 구멍 메움. 못 찾으면 null
async function autoMask(photo, mw, mh) {
  const seg = await Promise.race([getSegmenter(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 20000))]);
  const result = seg.segment(photo);
  const cm = result.categoryMask, cw = cm.width, ch = cm.height, cat = cm.getAsUint8Array().slice();
  result.close && result.close();
  const mask = new Uint8Array(mw * mh);
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {   // 크기가 다르면 가까운 칸으로 맞춤
    const c = cat[Math.min(ch - 1, (y * ch / mh) | 0) * cw + Math.min(cw - 1, (x * cw / mw) | 0)];
    mask[y * mw + x] = (c === 1 || c === 3) ? 1 : 0;
  }
  const { size } = cleanMask(mask, mw, mh);
  return size >= mw * mh * 0.01 ? mask : null;
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}

// 가장 큰 덩어리만 남기고 안쪽 구멍은 채움 (head를 그 자리에서 고침)
function cleanMask(head, w, h) {
  const n = w * h;
  // 가장 큰 연결 덩어리만 남김
  const lab = new Int32Array(n), stack = new Int32Array(n);
  let best = 0, bestSize = 0, next = 0;
  for (let i = 0; i < n; i++) {
    if (!head[i] || lab[i]) continue;
    next++; let sp = 0, size = 0; stack[sp++] = i; lab[i] = next;
    while (sp) {
      const k = stack[--sp]; size++;
      const x = k % w, y = (k / w) | 0;
      if (x > 0 && head[k - 1] && !lab[k - 1]) { lab[k - 1] = next; stack[sp++] = k - 1; }
      if (x < w - 1 && head[k + 1] && !lab[k + 1]) { lab[k + 1] = next; stack[sp++] = k + 1; }
      if (y > 0 && head[k - w] && !lab[k - w]) { lab[k - w] = next; stack[sp++] = k - w; }
      if (y < h - 1 && head[k + w] && !lab[k + w]) { lab[k + w] = next; stack[sp++] = k + w; }
    }
    if (size > bestSize) { bestSize = size; best = next; }
  }
  if (!best) return { mask: head, size: 0 };
  // 바깥 테두리에서 닿는 빈 곳만 배경 → 나머지 구멍은 머리로 채움
  const outside = new Uint8Array(n); let sp = 0;
  const push = (k) => { if (!outside[k] && lab[k] !== best) { outside[k] = 1; stack[sp++] = k; } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) {
    const k = stack[--sp], x = k % w, y = (k / w) | 0;
    if (x > 0) push(k - 1); if (x < w - 1) push(k + 1); if (y > 0) push(k - w); if (y < h - 1) push(k + w);
  }
  let size = 0;
  for (let i = 0; i < n; i++) { head[i] = outside[i] ? 0 : 1; size += head[i]; }
  return { mask: head, size };
}

// 가장자리를 부드럽게 (3×3 상자 흐림 두 번)
function soften(a, w, h) {
  let src = Float32Array.from(a), dst = new Float32Array(a.length);
  for (let pass = 0; pass < 2; pass++) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0, c = 0;
      for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) { const xx = x + dx; if (xx < 0 || xx >= w) continue; s += src[yy * w + xx]; c++; } }
      dst[y * w + x] = s / c;
    }
    [src, dst] = [dst, src];
  }
  return src;
}

// 브라우저가 HEIC를 직접 못 열면(크롬·엣지·파이어폭스) 그때만 변환기를 받아 JPEG로 바꿈
async function openPhoto(file) {
  try { return await loadImage(file); } catch (e) {
    const { heicTo, isHeic } = await import(HEIC_TO);
    if (!(await isHeic(file).catch(() => false)) && !/\.hei[cf]$/i.test(file.name)) throw e;
    setStatus("HEIC 사진 변환 중…");
    let jpg;
    try { jpg = await heicTo({ blob: file, type: "image/jpeg", quality: 0.92 }); } catch (err) { throw new Error("decode"); }
    return loadImage(jpg);
  }
}

// 1단계: 사진 열기 + 자동 누끼 (사진은 최대 1024px로 줄여서 다룸)
async function preparePhoto(file) {
  const img = await openPhoto(file);
  const sc = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
  const mw = Math.max(1, Math.round(img.naturalWidth * sc)), mh = Math.max(1, Math.round(img.naturalHeight * sc));
  const photo = document.createElement("canvas"); photo.width = mw; photo.height = mh;
  photo.getContext("2d", { willReadFrequently: true }).drawImage(img, 0, 0, mw, mh);
  setStatus("얼굴을 자동으로 찾는 중…");
  let auto = null;
  try { auto = await autoMask(photo, mw, mh); } catch (e) { console.warn("자동 누끼 실패", e); }
  return { img, photo, auto, mask: auto ? auto.slice() : new Uint8Array(mw * mh), mw, mh };
}

// 머리카락 색: 선택 영역 위쪽 20%에서 어두운 쪽 절반의 평균 (뒤통수 색으로 씀)
function hairColor(photo, mask, mw, mh, bb) {
  const px = photo.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, mw, mh).data;
  const yEnd = bb.y0 + Math.max(1, Math.round((bb.y1 - bb.y0) * 0.2)), list = [];
  for (let y = bb.y0; y <= yEnd; y += 2) for (let x = bb.x0; x <= bb.x1; x += 2) {
    const i = y * mw + x; if (!mask[i]) continue;
    const o = i * 4; list.push([px[o] + px[o + 1] + px[o + 2], px[o], px[o + 1], px[o + 2]]);
  }
  if (list.length < 20) return "#342d2c";
  list.sort((p, q) => p[0] - q[0]);
  const n = Math.ceil(list.length / 2); let r = 0, g = 0, b = 0;
  for (let i = 0; i < n; i++) { r += list[i][1]; g += list[i][2]; b += list[i][3]; }
  const hex = (v) => Math.round(v).toString(16).padStart(2, "0");
  return "#" + hex(r / n * 0.85) + hex(g / n * 0.85) + hex(b / n * 0.85);
}

function maskBox(mask, mw, mh) {
  let x0 = mw, y0 = mh, x1 = -1, y1 = -1;
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if (mask[y * mw + x]) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return x1 < 0 ? null : { x0, y0, x1, y1 };
}

// 3단계: 다듬은 마스크 → 얼굴 텍스처 + 외곽선
function buildMalangi({ img, photo, mask, mw, mh }) {
  const bb = maskBox(mask, mw, mh);
  const hair = hairColor(photo, mask, mw, mh, bb);
  const { x0, y0, x1, y1 } = bb;
  // 중심 = 머리 영역 상자 가운데, 크기 = 가장 먼 외곽선이 FILL에 오도록
  const cx = (x0 + x1 + 1) / 2, cy = (y0 + y1 + 1) / 2;
  let far = 1;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (mask[y * mw + x]) {
    const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy); if (d > far) far = d;
  }
  const half = far / FILL;                       // 마스크 좌표 기준 텍스처 절반 크기

  // 부드러운 알파 마스크 캔버스
  const soft = soften(mask, mw, mh);
  const mc = document.createElement("canvas"); mc.width = mw; mc.height = mh;
  const mg = mc.getContext("2d"), md = mg.createImageData(mw, mh);
  for (let i = 0; i < mw * mh; i++) { md.data[i * 4 + 3] = Math.round(soft[i] * 255); }
  mg.putImageData(md, 0, 0);

  // 정사각형 텍스처: 사진을 그리고 마스크 모양만 남김
  const out = document.createElement("canvas"); out.width = out.height = OUT;
  const og = out.getContext("2d", { willReadFrequently: true });
  const k = OUT / (2 * half);                    // 마스크 1칸 → 텍스처 픽셀
  og.imageSmoothingQuality = "high";
  og.setTransform(k, 0, 0, k, OUT / 2 - cx * k, OUT / 2 - cy * k);
  og.drawImage(img, 0, 0, mw, mh);               // 사진을 마스크 좌표계 크기로
  og.globalCompositeOperation = "destination-in";
  og.drawImage(mc, 0, 0);
  og.setTransform(1, 0, 0, 1, 0, 0);
  og.globalCompositeOperation = "source-over";

  // 각도별 외곽선 거리 (θ=0 오른쪽, 반시계 방향, 화면 위가 +y)
  const a = og.getImageData(0, 0, OUT, OUT).data;
  const radii = [];
  for (let r = 0; r < RAYS; r++) {
    const th = r / RAYS * Math.PI * 2, dx = Math.cos(th), dy = -Math.sin(th);
    let edge = 0;
    for (let t = 0; t < OUT / 2; t += 0.5) {
      const x = Math.round(OUT / 2 + dx * t), y = Math.round(OUT / 2 + dy * t);
      if (x < 0 || y < 0 || x >= OUT || y >= OUT) break;
      if (a[(y * OUT + x) * 4 + 3] >= 128) edge = t;
    }
    radii.push(edge / (OUT / 2));
  }
  // 들쭉날쭉한 외곽선을 살짝 고르게
  const sm = radii.map((_, i) => {
    let s = 0; for (let j = -3; j <= 3; j++) s += radii[(i + j + RAYS) % RAYS]; return Math.max(0.3, s / 7);
  });
  return { face: out.toDataURL("image/png"), radii: sm.map((v) => +v.toFixed(3)), hair };
}

/* ---------- 2단계: 영역 선택 (따라 그리기 / 지우기 / 살리기) ---------- */
const cv = $("mkCanvas"), cg = cv.getContext("2d");
let ed = null;   // { seg, mask, maskCv, maskImg, work, view, scale, undo, tool, ptr, last, lasso }

function setTool(tool) {   // "lasso" 따라 그리기 | "erase" 지우기 | "restore" 살리기
  ed.tool = tool;
  $("mkLasso").setAttribute("aria-pressed", String(tool === "lasso"));
  $("mkErase").setAttribute("aria-pressed", String(tool === "erase"));
  $("mkRestore").setAttribute("aria-pressed", String(tool === "restore"));
  $("mkSizeWrap").hidden = tool === "lasso";
  cv.style.cursor = tool === "lasso" ? "crosshair" : "none";
  requestRender();
}
function updateMakeBtn() { $("mkMake").disabled = !ed || !ed.mask.some((v) => v); }

function syncMaskCanvas() {   // 마스크 전체를 화면용 캔버스에 다시 반영
  const d = ed.maskImg.data, m = ed.mask;
  for (let i = 0; i < m.length; i++) d[i * 4 + 3] = m[i] ? 255 : 0;
  ed.maskCv.getContext("2d").putImageData(ed.maskImg, 0, 0);
}

function render() {
  if (!ed) return;
  const { view: V, seg, work, maskCv } = ed;
  const W = cv.width, H = cv.height;
  // 바탕: 체크무늬 위에 흐린 사진 (잘려 나갈 부분)
  cg.setTransform(1, 0, 0, 1, 0, 0);
  const t = Math.max(8, Math.round(W / 40));
  for (let y = 0; y < H; y += t) for (let x = 0; x < W; x += t) {
    cg.fillStyle = ((x / t + y / t) & 1) ? "#d9d4ee" : "#f4f2fb"; cg.fillRect(x, y, t, t);
  }
  cg.globalAlpha = 0.28;
  cg.drawImage(seg.photo, V.x, V.y, V.w, V.h, 0, 0, W, H);
  cg.globalAlpha = 1;
  // 남길 부분은 선명하게
  const wg = work.getContext("2d");
  wg.globalCompositeOperation = "copy";
  wg.drawImage(seg.photo, V.x, V.y, V.w, V.h, 0, 0, V.w, V.h);
  wg.globalCompositeOperation = "destination-in";
  wg.drawImage(maskCv, V.x, V.y, V.w, V.h, 0, 0, V.w, V.h);
  wg.globalCompositeOperation = "source-over";
  cg.drawImage(work, 0, 0, V.w, V.h, 0, 0, W, H);
  // 그리는 중인 올가미 선
  if (ed.lasso && ed.lasso.length > 1) {
    const k = W / V.w;
    cg.beginPath();
    ed.lasso.forEach((p, i) => { const x = (p.x - V.x) * k, y = (p.y - V.y) * k; i ? cg.lineTo(x, y) : cg.moveTo(x, y); });
    cg.lineJoin = "round"; cg.lineWidth = 3 * (W / cv.clientWidth); cg.strokeStyle = "rgba(255,255,255,.95)"; cg.stroke();
    cg.setLineDash([6 * (W / cv.clientWidth), 5 * (W / cv.clientWidth)]); cg.lineWidth = 1.5 * (W / cv.clientWidth); cg.strokeStyle = "#5b43e8"; cg.stroke(); cg.setLineDash([]);
  }
  // 붓 위치
  if (ed.ptr && ed.tool !== "lasso") {
    const dpr = W / cv.clientWidth, r = +$("mkSize").value / 2 * dpr;
    cg.lineWidth = 1.5 * dpr;
    cg.strokeStyle = "rgba(0,0,0,.55)"; cg.beginPath(); cg.arc(ed.ptr.x * dpr, ed.ptr.y * dpr, r, 0, 7); cg.stroke();
    cg.strokeStyle = "rgba(255,255,255,.9)"; cg.beginPath(); cg.arc(ed.ptr.x * dpr, ed.ptr.y * dpr, r - 1.5 * dpr, 0, 7); cg.stroke();
  }
}
let rafOn = false;
function requestRender() { if (!rafOn) { rafOn = true; requestAnimationFrame(() => { rafOn = false; render(); }); } }

function layoutEditor() {
  const V = ed.view;
  const maxW = Math.max(200, $("mkEditor").clientWidth), maxH = Math.max(220, Math.min(window.innerHeight * 0.52, 520));
  ed.scale = Math.min(maxW / V.w, maxH / V.h);
  const cssW = Math.round(V.w * ed.scale), cssH = Math.round(V.h * ed.scale), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  requestRender();
}

function openEditor(seg) {
  const { mw, mh } = seg;
  const view = { x: 0, y: 0, w: mw, h: mh };   // 사진 전체
  const maskCv = document.createElement("canvas"); maskCv.width = mw; maskCv.height = mh;
  const work = document.createElement("canvas"); work.width = mw; work.height = mh;
  ed = { seg, mask: seg.mask, maskCv, maskImg: maskCv.getContext("2d").createImageData(mw, mh), work, view, scale: 1, undo: [], tool: "lasso", ptr: null, last: null, lasso: null };
  syncMaskCanvas();
  setTool(seg.auto ? "erase" : "lasso");
  $("mkAuto").hidden = !seg.auto;
  $("mkUndo").disabled = true; updateMakeBtn();
  drop.hidden = true; $("mkEditor").hidden = false; $("mkCard").classList.add("editing");
  $("mkTitle").textContent = "얼굴 영역 고르기";
  $("mkLead").innerHTML = seg.auto
    ? "자동으로 고른 영역이에요.<br>삐져나온 곳은 <b>지우기</b>, 빠진 곳은 <b>살리기</b>나 <b>따라 그리기</b>로 고쳐요."
    : "<b>따라 그리기</b>로 얼굴(머리카락 포함) 둘레를 한 바퀴 그려 주세요.<br>삐져나온 곳은 <b>지우기</b>, 빠진 곳은 <b>살리기</b>로 고쳐요.";
  setStatus(seg.auto ? "" : "얼굴을 자동으로 찾지 못했어요. 직접 그려 주세요.");
  layoutEditor();
  requestAnimationFrame(() => { if (ed) layoutEditor(); });   // 카드 폭이 정해진 뒤 한 번 더 맞춤
}

function closeEditor() {
  ed = null; fileEl.value = "";
  drop.hidden = false; $("mkEditor").hidden = true; $("mkCard").classList.remove("editing");
  $("mkTitle").textContent = "얼굴 말랑이 만들기";
  $("mkLead").innerHTML = "사진을 넣으면 얼굴을 자동으로 오려 주고,<br>직접 다듬은 모양 그대로 얼굴 말랑이로 만들어요.";
  setStatus("");
}

function toMask(e) {
  const r = cv.getBoundingClientRect();
  return { x: ed.view.x + (e.clientX - r.left) / ed.scale, y: ed.view.y + (e.clientY - r.top) / ed.scale, cx: e.clientX - r.left, cy: e.clientY - r.top };
}

function paintDot(x, y, rad, val, dirty) {
  const { mask, maskImg, seg } = ed, mw = seg.mw, mh = seg.mh, d = maskImg.data, r2 = rad * rad;
  const xa = Math.max(0, Math.floor(x - rad)), xb = Math.min(mw - 1, Math.ceil(x + rad));
  const ya = Math.max(0, Math.floor(y - rad)), yb = Math.min(mh - 1, Math.ceil(y + rad));
  for (let yy = ya; yy <= yb; yy++) for (let xx = xa; xx <= xb; xx++) {
    const dx = xx + 0.5 - x, dy = yy + 0.5 - y;
    if (dx * dx + dy * dy > r2) continue;
    const i = yy * mw + xx; mask[i] = val; d[i * 4 + 3] = val ? 255 : 0;
  }
  dirty.x0 = Math.min(dirty.x0, xa); dirty.y0 = Math.min(dirty.y0, ya); dirty.x1 = Math.max(dirty.x1, xb); dirty.y1 = Math.max(dirty.y1, yb);
}

function strokeTo(p) {
  const rad = +$("mkSize").value / 2 / ed.scale, val = ed.tool === "erase" ? 0 : 1;
  const a = ed.last || p, dist = Math.hypot(p.x - a.x, p.y - a.y), steps = Math.max(1, Math.ceil(dist / Math.max(0.5, rad / 3)));
  const dirty = { x0: Infinity, y0: Infinity, x1: -1, y1: -1 };
  for (let i = 1; i <= steps; i++) paintDot(a.x + (p.x - a.x) * i / steps, a.y + (p.y - a.y) * i / steps, rad, val, dirty);
  if (dirty.x1 >= 0) ed.maskCv.getContext("2d").putImageData(ed.maskImg, 0, 0, dirty.x0, dirty.y0, dirty.x1 - dirty.x0 + 1, dirty.y1 - dirty.y0 + 1);
  ed.last = p;
}

// 올가미 안쪽을 선택 영역에 더함
function fillLasso(pts) {
  const { mw, mh } = ed.seg;
  const tmp = document.createElement("canvas"); tmp.width = mw; tmp.height = mh;
  const tg = tmp.getContext("2d", { willReadFrequently: true });
  tg.beginPath(); pts.forEach((p, i) => i ? tg.lineTo(p.x, p.y) : tg.moveTo(p.x, p.y)); tg.closePath();
  tg.fillStyle = "#000"; tg.fill();
  const d = tg.getImageData(0, 0, mw, mh).data;
  for (let i = 0; i < mw * mh; i++) if (d[i * 4 + 3] >= 128) ed.mask[i] = 1;
  syncMaskCanvas();
}

cv.addEventListener("pointerdown", (e) => {
  if (!ed) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  ed.undo.push(ed.mask.slice()); if (ed.undo.length > 30) ed.undo.shift();
  $("mkUndo").disabled = false;
  const p = toMask(e); ed.ptr = { x: p.cx, y: p.cy }; ed.last = null; ed.drawing = true;
  if (ed.tool === "lasso") ed.lasso = [p]; else strokeTo(p);
  requestRender();
});
cv.addEventListener("pointermove", (e) => {
  if (!ed) return;
  const p = toMask(e); ed.ptr = { x: p.cx, y: p.cy };
  if (ed.drawing) { if (ed.tool === "lasso") ed.lasso.push(p); else strokeTo(p); }
  requestRender();
});
const endStroke = () => {
  if (!ed || !ed.drawing) return;
  ed.drawing = false; ed.last = null;
  if (ed.lasso) {
    if (ed.lasso.length >= 3) fillLasso(ed.lasso); else ed.undo.pop();
    ed.lasso = null; $("mkUndo").disabled = !ed.undo.length;
  }
  updateMakeBtn(); requestRender();
};
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);
cv.addEventListener("pointerleave", (e) => { if (ed && !ed.drawing) { ed.ptr = null; requestRender(); } });

function undo() {
  if (!ed || !ed.undo.length) return;
  ed.mask = ed.undo.pop(); syncMaskCanvas(); requestRender();
  $("mkUndo").disabled = !ed.undo.length; updateMakeBtn();
}
$("mkLasso").addEventListener("click", () => setTool("lasso"));
$("mkErase").addEventListener("click", () => setTool("erase"));
$("mkRestore").addEventListener("click", () => setTool("restore"));
$("mkSize").addEventListener("input", requestRender);
$("mkUndo").addEventListener("click", undo);
$("mkAuto").addEventListener("click", () => {
  if (!ed || !ed.seg.auto) return;
  ed.undo.push(ed.mask.slice()); $("mkUndo").disabled = false;
  ed.mask = ed.seg.auto.slice(); syncMaskCanvas(); requestRender(); updateMakeBtn();
});
$("mkReset").addEventListener("click", () => {
  if (!ed) return;
  ed.undo.push(ed.mask.slice()); $("mkUndo").disabled = false;
  ed.mask = new Uint8Array(ed.mask.length); syncMaskCanvas(); requestRender(); updateMakeBtn();
});
$("mkAgain").addEventListener("click", closeEditor);
document.addEventListener("keydown", (e) => {
  if (ed && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
});
window.addEventListener("resize", () => { if (ed) layoutEditor(); });

$("mkMake").addEventListener("click", async () => {
  if (!ed) return;
  const { mw, mh } = ed.seg;
  const { mask, size } = cleanMask(ed.mask.slice(), mw, mh);   // 떨어진 조각은 빼고 안쪽 구멍은 채움
  if (size < mw * mh * 0.002) { setStatus("고른 영역이 너무 작아요. 얼굴 둘레를 크게 그려 주세요.", true); return; }
  setStatus("말랑이로 바꾸는 중…");
  await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
  const data = buildMalangi({ ...ed.seg, mask });
  ed = null;
  $("maker").hidden = true; $("newPhoto").hidden = false;
  window.startMalangi(data);
});

async function handle(file) {
  if (busy || !file) return;
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(file.name)) { setStatus("사진 파일을 골라 주세요.", true); return; }
  busy = true; drop.style.pointerEvents = "none";
  setStatus("사진을 여는 중…");
  try {
    openEditor(await preparePhoto(file));
  } catch (e) {
    console.error(e);
    const msg = e && e.message === "decode" ? "이 사진 형식은 열 수 없어요. JPG, PNG, HEIC 사진으로 다시 해 보세요."
      : "사진을 열지 못했어요. 다른 사진으로 다시 해 보세요.";
    setStatus(msg, true);
  }
  busy = false; drop.style.pointerEvents = "";
}

fileEl.addEventListener("change", () => handle(fileEl.files[0]));
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => handle(e.dataTransfer.files[0]));
// 3D 장면은 한 번만 만들 수 있어서 새 사진은 새로고침 후 다시
$("newPhoto").addEventListener("click", () => location.reload());
</script>
</body>
</html>
